<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cart - SEILIN</title>

    <link rel="stylesheet" href="Ecom.css">
</head>

<body>

   <!-- =========================
     CART PAGE
========================= -->

<section class="cart-page">

    <div class="container">

        <h1>Your Cart</h1>


        <div class="cart-layout">

            <!-- =========================
                 CART PRODUCTS
            ========================= -->

            <div class="cart-items">

                <!-- JavaScript products yahan show karega -->

            </div>


            <!-- =========================
                 ORDER SUMMARY
            ========================= -->

            <div class="cart-summary">

                <h2>Order Summary</h2>


                <div class="summary-row">

                    <span>Subtotal</span>

                    <span id="cart-subtotal">
                        Rs. 0
                    </span>

                </div>


                <div class="summary-row">

                    <span>Shipping</span>

                    <span>Free</span>

                </div>


                <div class="summary-divider"></div>


                <div class="summary-total">

                    <span>Total</span>

                    <span id="cart-total">
                        Rs. 0
                    </span>

                </div>


                <button
                    class="checkout-btn"
                    type="button"
                >
                    Proceed to Checkout
                </button>


                <a
                    href="index.html"
                    class="continue-shopping"
                >
                    ← Continue Shopping
                </a>

            </div>

        </div>

    </div>

</section>

    <script src="Ecom.js"></script>

</body>

</html>
